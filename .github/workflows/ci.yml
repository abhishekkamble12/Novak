name: Lumen CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build contracts
        run: npm run build --workspace=@lumen/contracts

      - name: Typecheck contracts
        run: npm run typecheck --workspace=@lumen/contracts

      - name: Typecheck API
        run: npm run typecheck --workspace=@lumen/api

      - name: Build & Typecheck Web
        run: npm run build --workspace=@lumen/web

  python-ai-check:
    name: AI Service Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check apps/ai-service

  docker-build-verify:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, python-ai-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          push: false

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ai-service/Dockerfile
          target: prod
          push: false

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
