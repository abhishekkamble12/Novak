name: Novak CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, unit tests & build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=@novak/contracts
      - run: npm run typecheck --workspace=@novak/contracts
      - run: npm run typecheck --workspace=@novak/api
      - name: API unit tests
        run: npm test --workspace=@novak/api
      - name: Web tests (loading / error / empty / success states)
        run: npm test --workspace=@novak/web
      - name: Build & typecheck web
        run: npm run build --workspace=@novak/web

  api-integration:
    name: API integration tests (MongoDB + Redis)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspace=@novak/contracts
      - name: Integration tests
        run: npm run test:integration --workspace=@novak/api
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017
          TEST_REDIS_URL: redis://127.0.0.1:6379/15

  python:
    name: AI service lint, tests & search-quality gate
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit and contract tests
        run: pytest -q
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: apps/ai-service/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-${{ hashFiles('apps/ai-service/requirements.txt') }}
      - name: Search evaluation (fails on quality regression)
        run: python -m eval.run_eval --check --out /tmp/search-eval.json

  e2e-smoke:
    name: Docker Compose end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [node, api-integration, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Build and start the full stack
        run: docker compose -f infra/docker-compose.yml --profile app up -d --build --wait --wait-timeout 300
      - name: Smoke test (publish -> analyse -> semantic search -> visibility -> delete)
        run: node scripts/smoke.mjs --base http://localhost:3000/api --web http://localhost
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile app down -v
