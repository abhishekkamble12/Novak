[project]
name = "novak-ai-service"
version = "0.1.0"
description = "Novak AI Service — FastEmbed text embeddings, Qdrant semantic search, and safety moderation"
authors = [{ name = "Abhishek" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "qdrant-client>=1.9.1",
    "redis>=5.0.6",
    "fastembed>=0.7",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
