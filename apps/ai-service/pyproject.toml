[project]
name = "novak-ai-service"
version = "0.1.0"
description = "Novak AI service: caption embeddings (FastEmbed), semantic search over Qdrant, rule-based caption screening"
authors = [{ name = "Abhishek" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "qdrant-client>=1.19.0,<1.20",
    "fastembed>=0.7,<0.8",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff==0.15.9",
    "pymongo>=4.8,<5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
