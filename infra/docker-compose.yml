services:
  mongo:
    image: mongo:7.0
    container_name: novak-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: novak
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: novak-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # Keep in step with qdrant-client in apps/ai-service/requirements.txt
    image: qdrant/qdrant:v1.19.1
    container_name: novak-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: novak-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/novak
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/ai-service/Dockerfile
      target: prod
    container_name: novak-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - AI_ENV=development
      # .env's PORT belongs to the API; pin the AI service's own port and bind address
      - PORT=8000
      - AI_HOST=0.0.0.0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: novak-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  nginx:
    profiles: ["app"]
    image: nginx:1.27.5-alpine # >= 1.27.3 required for `resolve` in upstream blocks
    container_name: novak-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NOVAK_WEB_UPSTREAM=web:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - api
      - web

volumes:
  mongo_data:
  redis_data:
  # New name for v1.19: the old v1.12 "qdrant_data" volume can't be opened by it directly
  qdrant_storage:
